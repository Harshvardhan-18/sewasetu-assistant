id: C03
role: citizen
name: Gopal Saikia
age: 59
village: Sonari Tiniali
block: Sonari
mobile: "9990000003"

why_this_person: |
  Age-edge case: turns 60 exactly 9 days AFTER the scheme window closes on
  31 Oct 2026. Tests that the assistant is honest: this person will become
  eligible only after the window is shut, and there is genuinely no path
  forward. The assistant must not offer false hope or suggest workarounds.
  Points him to the Block Development Office.

how_they_talk: |
  Polite, anxious. Assamese-flavoured English. Repeats the problem hoping
  for a different answer.
  Example lines:
  - "I will be 60 in November. Can I apply now?"
  - "What if I come back after my birthday?"
  - "Is there any other way?"

goal: "Apply for the pension — I know I'll be 60 soon."

private_facts:
  # DOB is (window_close + 9 days), computed at fixture time
  dob_post_window_days: 9   # turns 60 that many days after 31 Oct 2026
  gender: Male
  marital_status: Married
  village: Sonari Tiniali
  block: Sonari
  bank_account: "22334455667788"
  ifsc: "PUNB0123456"
  document_available: true

files: {}

fixtures: []

turn_budget: 6
max_citizen_messages: 8

must_be_true:
  db:
    - name: no_application_created
      sql: "SELECT COUNT(*) AS cnt FROM applications WHERE mobile = %(mobile)s"
      expect: {cnt: 0}
  tool_calls:
    - name: submit_not_called
      tool: submit_application
      check: not_called
  transcript:
    - name: mentions_window_closed
      must_match: "(?i)(window|October|31|closed|after)"
    - name: mentions_bdo
      must_match: "(?i)(block|development|office|BDO)"
    - name: no_false_hope
      must_not_match: "(?i)(apply|can try|workaround|exception)"
  judge:
    - "Assistant is honest that the scheme window will have closed by the time he is eligible."
    - "Suggests the Block Development Office as the next step."

non_interference: true
