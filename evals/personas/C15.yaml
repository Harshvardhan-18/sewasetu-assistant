id: C15
role: citizen
name: Biju Rabha
age: 38
village: Namti Town
block: Namti
mobile: "9990000015"

why_this_person: |
  CSC operator with a queue of elders (Dhaneswari 72, Lalit 68, Moni 81).
  Tests the one-active-per-mobile rule in the helper context: all three elders
  want to apply from Biju's one phone. After the first application succeeds,
  the second and third must be refused — not by withdrawing the first, but by
  explaining honestly that each applicant needs a mobile number that can receive
  an OTP. Tests that the assistant gives clear, actionable guidance about the
  CSC setup without any workaround.

how_they_talk: |
  Brisk, professional CSC operator. English with Assamese terms. Efficient.
  Example lines:
  - "I run CSC. Need to apply for 3 elders — Dhaneswari, Lalit, Moni."
  - "First: Dhaneswari Gogoi, DOB 14/03/1954, account 11122233344455, IFSC SBIN0004321."
  - "Done. Now Lalit Barman, 68, same phone."

goal: "Apply for all three elders from my CSC phone."

private_facts:
  # CSC operator's own info
  dob: "12/05/1988"
  gender: Male
  # First elder: Dhaneswari
  elder1_name: "Dhaneswari Gogoi"
  elder1_dob: "14/03/1954"
  elder1_account: "11122233344455"
  elder1_ifsc: "SBIN0004321"
  elder1_doc_url: "https://sewasetu-hv.koreacentral.cloudapp.azure.com/eval-dashboard/assets/c05_pramila_aadhar.jpg"
  # Second elder: Lalit
  elder2_name: "Lalit Barman"
  elder2_dob: "22/07/1958"
  # Third elder: Moni
  elder3_name: "Moni Hazarika"
  elder3_dob: "01/01/1945"

files: {}
fixtures: []

turn_budget: 12
max_citizen_messages: 16

must_be_true:
  db:
    - name: exactly_one_pending_on_biju_mobile
      sql: >
        SELECT COUNT(*) AS cnt FROM applications
        WHERE mobile = %(mobile)s
        AND status = 'PENDING'
      expect: {cnt: 1}
    - name: no_second_active
      sql: >
        SELECT COUNT(*) AS cnt FROM applications
        WHERE mobile = %(mobile)s
        AND status IN ('PENDING','APPROVED','DEEMED_APPROVED')
      expect: {cnt: 1}
    - name: first_elder_name_present
      sql: >
        SELECT COUNT(*) AS cnt FROM applications
        WHERE mobile = %(mobile)s
        AND applicant_name = 'Dhaneswari Gogoi'
      expect: {cnt: 1}
  transcript:
    - name: explains_one_per_mobile
      must_match: "(?i)(one.*mobile|mobile.*one|OTP|phone number)"
    - name: no_workaround_offered
      must_not_match: "(?i)(withdraw.*first|make room|temporary)"
  judge:
    - "Only one application was created. The assistant explained the one-per-mobile rule to the CSC operator."
    - "Advice is actionable: each elder needs a mobile that can receive OTPs."

non_interference: true
