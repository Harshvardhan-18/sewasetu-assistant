# docker-compose.assistant.yml
# Layer on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.assistant.yml up -d --build
#
# Adds: caddy (HTTPS edge), mcp-citizen, mcp-officer, eval-dashboard (stubs for now).
# Adds restart policy and healthchecks to the original services.

services:
  # ── Override existing services with restart + healthcheck ─────────────

  db:
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sewasetu"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    restart: unless-stopped
    # Remove the direct host port — Caddy is the edge now
    ports: !reset []
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  scheduler:
    restart: unless-stopped

  smsgw:
    restart: unless-stopped

  migrate:
    image: postgres:15
    restart: "no"
    command: ["sh", "-c", "until pg_isready -h db -U sewasetu; do sleep 2; done; psql -v ON_ERROR_STOP=1 postgresql://sewasetu:sewasetu123@db/sewasetu -f /migrations.sql"]
    volumes:
      - ./app/migrations.sql:/migrations.sql:ro
    depends_on:
      db:
        condition: service_healthy

  # ── New services ──────────────────────────────────────────────────────

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"    # HTTP/3
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  mcp-citizen:
    build:
      context: .
      dockerfile: citizen_mcp/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      CANONICAL_URL: ${PUBLIC_BASE_URL}/citizen/mcp
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      INTERNAL_API_URL: http://app:8000/internal/api/v1
      INTERNAL_JWKS_URL: http://app:8000/.well-known/jwks.json
    depends_on:
      app:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  mcp-officer:
    build:
      context: .
      dockerfile: officer_mcp/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      CANONICAL_URL: ${PUBLIC_BASE_URL}/officer/mcp
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      INTERNAL_API_URL: http://app:8000/internal/api/v1
      INTERNAL_JWKS_URL: http://app:8000/.well-known/jwks.json
    depends_on:
      app:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  eval-dashboard:
    build: ./stubs/healthz
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
